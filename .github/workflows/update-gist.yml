name: Update Gist Status
on:
  repository_dispatch:
    types: [update_gist_status]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update status
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"files":{"status.json":{"content":"{\"status\":\"${{ github.event.client_payload.status }}\"}"}}}' \
            "https://api.github.com/gists/${{ github.event.client_payload.gist_id}}"
