name: Update Server Status

on:
  issues:
    types: [opened]

jobs:
  update_status:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, 'Gist ID:')
    
    steps:
      - name: Extract status data
        id: extract
        run: |
          GIST_ID=$(grep -oP 'Gist ID: \K[^\n]+' <<< "${{ github.event.issue.body }}")
          STATUS=$(grep -oP 'New Status: \K[^\n]+' <<< "${{ github.event.issue.body }}")
          echo "gist_id=${GIST_ID}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Обновляем status.json
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "files": {
                "status.json": {
                  "content": "{\"status\":\"${{ steps.extract.outputs.status }}\"}"
                }
              }
            }' \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}"

      - name: Update history
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Получаем текущую историю
          HISTORY=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}" | \
            jq -r '.files["history.json"].content // "[]"')
          
          # Добавляем новую запись
          UPDATED_HISTORY=$(echo "$HISTORY" | \
            jq --arg status "${{ steps.extract.outputs.status }}" \
               --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '. |= [{"status": $status, "timestamp": $timestamp}] + .[:9]')
          
          # Сохраняем обновленную историю
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "files": {
                "history.json": {
                  "content": $UPDATED_HISTORY
                }
              }
            }' \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}"

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}"
