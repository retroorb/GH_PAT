name: Update Gist Status

on:
  issues:
    types: [opened]

jobs:
  update:
    if: contains(github.event.issue.body, 'Gist ID:')
    runs-on: ubuntu-latest
    steps:
      - name: Extract data
        id: extract
        run: |
          GIST_ID=$(grep -oP 'Gist ID: \K.*' <<< "${{ github.event.issue.body }}")
          STATUS=$(grep -oP 'New Status: \K.*' <<< "${{ github.event.issue.body }}")
          echo "gist_id=${GIST_ID}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Get current status and history
        id: get_history
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Получаем текущий Gist
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}")
          
          # Извлекаем текущий статус и историю
          CURRENT_STATUS=$(echo "$RESPONSE" | jq -r '.files["status.json"].content' | jq -r '.status')
          HISTORY=$(echo "$RESPONSE" | jq -r '.files["history.json"].content // "[]"' | jq -r '.')
          
          # Добавляем новый статус в историю
          UPDATED_HISTORY=$(echo "$HISTORY" | jq --arg status "$CURRENT_STATUS" --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '. += [{"status": $status, "timestamp": $timestamp}] | .[-10:]') # Ограничиваем до 10 записей
          
          echo "current_status=${CURRENT_STATUS}" >> $GITHUB_OUTPUT
          echo "updated_history=${UPDATED_HISTORY}" >> $GITHUB_OUTPUT

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "files": {
                "status.json": {
                  "content": "{\"status\":\"${{ steps.extract.outputs.status }}\"}"
                },
                "history.json": {
                  "content": ${{ steps.get_history.outputs.updated_history }}
                }
              }
            }' \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}"

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}"
