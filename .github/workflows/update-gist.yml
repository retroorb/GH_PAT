name: Update Gist Status
on:
  repository_dispatch:
    types: [workflow_dispatch] # Должен совпадать с event_type!
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -d '{"files":{"status.json":{"content":"{\"status\":\"${{ github.event.client_payload.status }}\"}"}}}' \
            https://api.github.com/gists/${{ github.event.client_payload.gist_id }}
