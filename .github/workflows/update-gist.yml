name: Update Gist from Issue

on:
  issues:
    types: [opened]

jobs:
  update:
    if: contains(github.event.issue.body, 'New status:')
    runs-on: ubuntu-latest
    steps:
      - name: Extract status
        id: extract
        run: |
          STATUS=$(grep -oP 'New status: \K[^\\n]+' <<< "${{ github.event.issue.body }}")
          GIST_ID=$(grep -oP 'Gist ID: \K[^\\n]+' <<< "${{ github.event.issue.body }}")
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "gist_id=${GIST_ID}" >> $GITHUB_OUTPUT
      
      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"files":{"status.json":{"content":"{\"status\":\"${{ steps.extract.outputs.status }}\"}"}}}' \
            "https://api.github.com/gists/${{ steps.extract.outputs.gist_id }}"
          
      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}"
