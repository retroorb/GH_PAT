name: Обновление статуса сервера

on:
  push:
    branches:
      - main  # Ветка, на которую пушатся изменения
  workflow_dispatch:  # Позволяет запускать workflow вручную через интерфейс GitHub

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозиторий
        uses: actions/checkout@v2

      - name: Настроить GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # Убедитесь, что ваш токен сохранён в GitHub Secrets как GH_PAT
        run: |
          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV

      - name: Обновить статус в Gist
        run: |
          curl -X PATCH "https://api.github.com/gists/375d0163df1ac31e855f24cba9ec952b" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -d '{
                "files": {
                  "status.json": {
                    "content": "{\"status\": \"🟢 Онлайн\"}"
                  },
                  "history.json": {
                    "content": "[{\"status\": \"🟢 Онлайн\", \"time\": \"'$(date -Iseconds)'\"}]"
                  }
                }
              }'

      - name: Деплой на сервер (если необходимо)
        run: |
          # Здесь можно добавить код для деплоя, если это нужно, например:
          # rsync, scp или любые другие команды для деплоя
          echo "Деплой на сервер завершён."
