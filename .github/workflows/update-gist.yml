name: Update Gist Status

on:
  issues:
    types: [opened]

jobs:
  update:
    if: contains(github.event.issue.body, 'Gist ID:')
    runs-on: ubuntu-latest
    steps:
      - name: Extract data
        id: extract
        run: |
          GIST_ID=$(grep -oP 'Gist ID: \K.*' <<< "${{ github.event.issue.body }}")
          STATUS=$(grep -oP 'New Status: \K.*' <<< "${{ github.event.issue.body }}")
          echo "gist_id=${GIST_ID}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: Get current history
        id: get_history
        run: |
          curl -s "https://gist.githubusercontent.com/${{ github.actor }}/${{ steps.extract.outputs.gist_id }}/raw/history.json" -o history.json || echo "[]" > history.json
          echo "content<<EOF" >> $GITHUB_ENV
          echo "$(cat history.json)" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Append new entry to history
        run: |
          NEW_ENTRY="{\"time\":\"$(date -u +"%Y-%m-%d %H:%M:%S") UTC\",\"status\":\"${{ steps.extract.outputs.status }}\"}"
          jq ". + [${NEW_ENTRY}]" history.json > new_history.json

      - name: Update Gist files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- https://api.github.com/gists/${{ steps.extract.outputs.gist_id }} <<EOF
            {
              "files": {
                "status.json": {
                  "content": "{\"status\":\"${{ steps.extract.outputs.status }}\"}"
                },
                "history.json": {
                  "content": "$(cat new_history.json | jq -c .)"
                }
              }
            }
EOF

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}"
